  <!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Scratchy Adventure Clone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Authentification -->
  <div id="authBox">
    <h2>Connexion / Inscription</h2>
    <form id="registerForm">
      <input type="text" id="username" placeholder="Nom d'utilisateur" required>
      <input type="password" id="password" placeholder="Mot de passe" required>
      <button type="submit">Créer un compte</button>
    </form>
    <form id="loginForm">
      <input type="text" id="loginUsername" placeholder="Nom d'utilisateur" required>
      <input type="password" id="loginPassword" placeholder="Mot de passe" required>
      <button type="submit">Se connecter</button>
    </form>
    <p id="message"></p>
  </div>

  <!-- Zone utilisateur -->
  <div id="welcomeBox" style="display:none;">
    <h2 id="welcomeText"></h2>
    <p id="infoCoins"></p>
    <button id="btnPlay">Jouer</button>
    <button id="btnLogout">Déconnexion</button>
    <h3>Historique</h3>
    <div id="history"></div>
    <h3>Paramètres</h3>
    <label>Volume :
      <input type="range" id="volumeControl" min="0" max="1" step="0.1">
    </label>
    <label>
      Mode téléphone :
      <input type="checkbox" id="mobileMode">
    </label>
  </div>

  <!-- Zone de jeu -->
  <div id="gameBox" style="display:none;">
    <h2>Scratchy Adventure</h2>
    <canvas id="gameCanvas" width="400" height="300"></canvas>
    <p>Poissons récoltés : <span id="fishCount">0</span></p>
    <button id="btnExitGame">Quitter le jeu</button>
  </div>

  <audio id="bgMusic" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_3f6d0d7f9b.mp3?filename=happy-adventure-11273.mp3" loop></audio>
  <script src="script.js"></script>
</body>
</html>
    <script  src="./script.js"></script>

  </body>
  
</html>
